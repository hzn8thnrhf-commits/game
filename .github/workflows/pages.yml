name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ios-block-blast-game-njpx35, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publishing to a branch named gh-pages auto-enables GitHub Pages on
      # public repos — no Pages API call needed (the API route requires
      # permissions the workflow token doesn't have).
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f origin gh-pages
